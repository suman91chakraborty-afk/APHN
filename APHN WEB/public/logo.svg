<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background Shield/Circle -->
  <circle cx="50" cy="50" r="46" fill="#0A2647" />
  
  <!-- Outer Ring Accent -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#F4762D" stroke-width="2" stroke-dasharray="8 4" />
  
  <!-- Heart / Cross shape inside -->
  <g transform="translate(50, 48) scale(0.9)">
    <!-- White Circle Backdrop for Cross -->
    <circle cx="0" cy="0" r="22" fill="#FFFFFF" />
    
    <!-- Medical Cross (Orange) -->
    <path d="M-6,-16 L6,-16 L6,-6 L16,-6 L16,6 L6,6 L6,16 L-6,16 L-6,6 L-16,6 L-16,-6 L-6,-6 Z" fill="#E85D1F" />
    
    <!-- ECG Heartbeat line overlay -->
    <path d="M-22,0 L-14,0 L-10,-8 L-6,12 L-2,-16 L2,8 L6,-4 L10,0 L22,0" fill="none" stroke="#0A2647" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Tagline arches -->
  <path id="curve" d="M 12 50 A 38 38 0 0 1 88 50" fill="none" />
  <text font-family="'Sora', sans-serif" font-size="6" font-weight="bold" fill="#FFEFE2" letter-spacing="1">
    <textPath href="#curve" startOffset="50%" text-anchor="middle">
      CARE • COLLABORATE • COMMIT
    </textPath>
  </text>
</svg>
